name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject declares. Testing only the newer one let a
        # 3.12-only f-string reach a shipped figure generator that 3.11 cannot parse.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The CPU build of PyTorch: the default CUDA wheel and its NVIDIA libraries fill the
      # runner's disk. "torch==2.9.1" in pyproject accepts 2.9.1+cpu, so it is not replaced.
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install ".[test,figures]"
      - name: Lint
        run: python -m ruff check .
      - name: Test source tree
        run: python -m pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m zipfile --list dist/deepshift-*.whl
