[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepshift"
version = "1.0.0"
description = "Predict protein NMR chemical shifts from 3D structure (structure-only 8 Å atom transformer)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "biopython==1.87",
  # 2.4.0 was yanked from PyPI; 2.3.3 is the version the shipped model runs on.
  "numpy==2.3.3",
  "pandas==2.3.3",
  "pyarrow==24.0.0",
  "pynmrstar==3.5.1",
  "requests==2.32.4",
  "scipy==1.16.3",
  "torch==2.9.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.5"]
# Regenerating the paper figures and supplementary tables. PyMOL itself (figures/
# _pymol_render.py) is a conda package run as an external subprocess, not a pip import,
# and is not listed here; see README.md's "System tools" table.
figures = [
  "matplotlib==3.10.7",
  "pillow==12.3.0",
]

[project.scripts]
deepshift = "deepshift.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deepshift.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", ".", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["colab"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",     # long lines: tables of constants and LaTeX strings
    "E741",     # `l` is the LaTeX line list in the table generators
    "SIM108",   # a ternary is not always clearer than the if/else it replaces
    "B905",     # zip without strict=
    "RUF001", "RUF002", "RUF003",   # typographic characters in figure labels and docstrings
]

[tool.ruff.lint.per-file-ignores]
# Generators and scripts put src/ on sys.path before importing the package.
"si_build/*" = ["E402"]
"figures/*" = ["E402"]
"scripts/*" = ["E402"]
# Lazily opened per-fold writer pool, closed in finally.
"src/deepshift/data/split.py" = ["SIM115"]
